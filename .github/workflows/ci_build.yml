name: CI Build

# Gera o build de produção da WebUI e o publica como artefato (conteúdo que vira o webui.zip).
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up NodeJs
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.1.2

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: webui-build-${{ github.sha }}
          path: build
          if-no-files-found: error
